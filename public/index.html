<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EC2 Node.js Learning App</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
      main { width: min(90%, 680px); padding: 3rem; border: 1px solid #334155; border-radius: 18px; background: #1e293b; box-shadow: 0 20px 50px #02061780; }
      h1 { margin-top: 0; color: #38bdf8; }
      code { padding: .2rem .4rem; border-radius: 4px; background: #0f172a; color: #fbbf24; }
      .status { color: #86efac; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from Node.js on EC2!</h1>
      <p>This simple app is ready to deploy to an Amazon EC2 instance.</p>
      <p class="status">● Server is running</p>
      <p>Try the health check: <code>/health</code></p>
    </main>
  </body>
</html>
